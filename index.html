  <title>ExxeStore | Enlaces oficiales</title>
  <style>
    :root {
      --bg: #09090d;
      --panel: rgba(20, 19, 29, .88);
      --text: #f7f5ff;
      --muted: #aaa5bb;
      --purple: #a78bfa;
      --purple-bright: #8b5cf6;
      --border: rgba(196, 181, 253, .18);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(124, 58, 237, .20), transparent 45%),
        radial-gradient(ellipse at 0% 80%, rgba(91, 33, 182, .10), transparent 35%),
        var(--bg);
    }
    .wrap { width: 100%; max-width: 470px; animation: rise .7s ease both; }
    .topline {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      margin-bottom: 18px; color: var(--muted); font-size: 11px;
      letter-spacing: .2em; text-transform: uppercase;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 14px #8b5cf6; }
    .card {
      position: relative; overflow: hidden; padding: 34px 25px 25px;
      border: 1px solid var(--border); border-radius: 28px;
      background: linear-gradient(145deg, rgba(28, 25, 40, .96), rgba(12, 12, 18, .96));
      box-shadow: 0 25px 80px rgba(0, 0, 0, .42), inset 0 1px rgba(255,255,255,.035);
    }
    .card::before {
      content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%;
      top: -150px; left: calc(50% - 110px);
      background: rgba(139, 92, 246, .20); filter: blur(35px); pointer-events: none;
    }
    .brand { position: relative; text-align: center; }
    .logo {
      display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 19px;
      border: 1px solid rgba(196,181,253,.45); border-radius: 25px;
      background: linear-gradient(145deg, #272039, #111018);
      color: #e9ddff; font-weight: 850; font-size: 26px; letter-spacing: -.08em;
      box-shadow: 0 0 38px rgba(139,92,246,.16), inset 0 1px rgba(255,255,255,.12);
    }
    h1 { margin: 0; font-size: clamp(31px, 8vw, 40px); letter-spacing: -.055em; line-height: 1; }
    h1 span { color: var(--purple); }
    .tagline { margin: 13px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .line { height: 1px; margin: 27px 0 22px; background: linear-gradient(90deg, transparent, var(--border), transparent); }
    .label { margin: 0 0 12px 2px; color: #8e879f; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .links { display: grid; gap: 11px; }
    .link {
      display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 15px;
      border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
      color: var(--text); text-decoration: none; background: rgba(255,255,255,.035);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: rgba(196,181,253,.42); background: rgba(167,139,250,.08); }
    .icon {
      flex: 0 0 43px; height: 43px; display: grid; place-items: center;
      border-radius: 13px; background: rgba(167,139,250,.12); color: #c4b5fd;
    }
    .icon svg { width: 21px; height: 21px; }
    .copy { flex: 1; min-width: 0; }
    .copy strong { display: block; font-size: 14px; font-weight: 650; }
    .copy small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .arrow { color: #79728c; font-size: 20px; transition: transform .2s; }
    .link:hover .arrow { transform: translateX(3px); color: #c4b5fd; }
    .note { margin: 20px 2px 0; color: #777184; font-size: 11px; text-align: center; line-height: 1.6; }
    footer { margin-top: 18px; color: #696476; font-size: 11px; text-align: center; }
    footer b { color: #a9a0bc; font-weight: 600; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  </style>
</head>
